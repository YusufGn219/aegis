[project]
name = "aegis"
version = "0.1.0"
description = "Local-first personal AI operating layer - Phase 0-4 vertical slice (workspace organizer)."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires a live vLLM server at AEGIS_VLLM_BASE_URL",
]
